# BluetoothAutoLock configuration
# Lines starting with '#' or ';' are comments. Format: KEY=VALUE
#
# Search order at startup:
#   1. <exe-dir>/config.ini
#   2. %ProgramData%/BluetoothAutoLock/config.ini
#   3. built-in defaults

# === Target device ===

# Display name saved from the selected paired device. The lock logic does not
# match by name because phones can expose multiple Bluetooth identities.
DeviceName=

# Required unique Classic Bluetooth MAC (AA:BB:CC:DD:EE:FF). Use
# 'BluetoothAutoLock.exe --list' to find the paired Classic address.
DeviceAddress=

# === Timing ===

# After keyboard/mouse has been idle for 30 seconds, the app starts checking
# Bluetooth. This value is the required continuous Bluetooth-absence duration
# before locking. 150 = 2.5 minutes. Range: 1..3600.
DisconnectDelaySeconds=150

# Final Bluetooth recheck attempts before locking.
# Any successful final probe cancels the lock. Default: 3. Range: 1..10.
DisconnectConfirmSeconds=3

# Minimum polling interval in seconds. Actual interval is randomized from this
# value through +7 seconds. Default 8 means random 8..15 seconds. Range: 1..60.
PollingIntervalSeconds=8

# === Logging ===

# Where to write log lines. Parent directory is auto-created.
LogPath=C:\ProgramData\BluetoothAutoLock\service.log

# Minimum log level: Debug, Info, Warn, Error
LogLevel=Info

# Rotate log when it exceeds this many megabytes. One backup is kept (.log.1).
MaxLogSizeMB=5

# === 锁屏前快捷键（可选） ===
# 自动锁屏真正执行前，会按编号顺序触发这些快捷键。
# 触发后等待用于给后台全局快捷键处理时间，然后再锁屏。范围：0..10000 毫秒。
LockShortcutSettleMilliseconds=3000
# 格式：LockShortcut1=Ctrl+Alt+K|备注作用
# 留空表示不触发额外快捷键；也可以在设置窗口“锁屏快捷键”页维护。
# LockShortcut1=Ctrl+Alt+K|关闭麦克风

# === LoL 启动/退出 → 游戏性能自动优化（可选） ===
# 检测到 LoL 启动：
#   1) 游戏开始前仅回收一次 WSL Linux 页缓存；
#   2) 可选：禁用 AskLink 虚拟显示器；
#   3) 可选：强制关闭 AskLink / ToDesk 远程软件。
# LoL 退出后会恢复虚拟显示器；远程软件会在无 LoL 的静默期后恢复，
# 且仅在本程序恢复启动时请求最小化/托盘静默启动，不改变软件自身正常启动状态。
# 注：虚拟显示器管理通常需要管理员权限；WSL 优化不限制 CPU。

# 启用 LoL → 虚拟显示器自动开关（true/false）
LolOptimizerEnabled=false

# LoL 主进程名（不含 .exe 扩展名）—— 用来检测 LoL 启动/退出
LolProcessName=League of Legends

# 虚拟显示器设备实例 ID（设备管理器或 pnputil /enum-devices /class Display 查询；空值=不管理）
VirtualDisplayDeviceId=

# 检测轮询间隔（秒，1-60）
LolOptimizerPollSeconds=3

# 自动优化 WSL（true/false）：只执行一次游戏前缓存回收。
# - wsl.exe -d <WslDistro> -u root -- sh -lc "sync; echo 3 > /proc/sys/vm/drop_caches"
LolWslOptimizeEnabled=true
WslDistro=Ubuntu

# 游戏时自动关闭远程软件（true/false）。仅恢复本程序确实结束、且游戏前已运行的实例。
# 恢复启动会尽量静默到托盘；手动/系统正常启动 AskLink、ToDesk 不受影响。
LolAutoCloseRemoteEnabled=true
RemoteCloseProcessNames=AskLink,ToDesk
RemoteRestartQuietMinutes=10

# === 游戏环境智能优化 / 异常监控 ===
# 右键菜单“智能优化游戏环境（游戏前运行）”：
# - 仅在异常时清理 LOL 卡顿总结中的 node/omx/python 残留群；
# - 仅在 LeagueCrashHandler 或过量 LeagueClientUxRender 等异常时清理 LoL 残留；
# - 普通高占用应用不会被自动结束。
# 长期监控每 5 分钟分析一次异常候选；只对严重残留、崩溃、疑似死循环托盘提醒，所有问题写入日志。
GameProblemMonitorEnabled=true
GameProblemMonitorIntervalMinutes=5
GameProblemMonitorAiEnabled=true
GameProblemMonitorAiEndpoint=https://ark.cn-beijing.volces.com/api/v3/responses
GameProblemMonitorAiModel=doubao-seed-2-0-lite-260215
# 源码模板默认不写密钥；可在 UI 填入，或设置环境变量 ARK_API_KEY。
GameProblemMonitorAiApiKey=
GameProblemMonitorAiApiKeyEnv=ARK_API_KEY
GameProblemNotifyRepeatMinutes=30
GameProblemRunawayCpuPercent=90
GameOptimizerToolZombieCountThreshold=20
GameOptimizerToolZombieMemoryMB=2048
GameOptimizerLolRenderCountThreshold=2
GameOptimizerToolCleanupProcessNames=node,omx-node-stdio-hidden,python
GameOptimizerLolCleanupProcessNames=LeagueCrashHandler64,LeagueClientUxRender,LeagueClient,League of Legends,RiotClientServices
